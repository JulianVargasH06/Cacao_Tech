spring.application.name=backend


# Conexion con PostgreSQL
# Cada valor se puede cambiar con una variable de entorno (DB_URL, DB_USERNAME, DB_PASSWORD)
# sin editar este archivo. Si no existe la variable, se usa el valor que va despues de los dos puntos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cacao_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Logs de mapeo de rutas
logging.level.org.springframework.web=DEBUG
logging.level.org.springdoc=DEBUG

